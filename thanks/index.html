<style>
:root{--ink:#3A3034;--muted:#7A6E70;--bg:#FFFBF6;--card:#FFFFFF;--line:#3A3034;--teal:#1E9C8C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}
.card{max-width:460px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:28px 24px;text-align:center;box-shadow:6px 6px 0 var(--line)}
.bar{height:8px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--teal) 0 18px,#FFE7A0 18px 36px);margin:0 0 22px}
h1{font-size:22px;margin:0 0 10px;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--muted);font-size:14.5px;line-height:1.55}
a.btn{display:inline-block;margin-top:10px;background:var(--teal);color:#fff;font-weight:700;border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--line);text-decoration:none;padding:11px 20px;border-radius:12px;font-size:14px}
</style></head>
