<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opening your deal — thefreebieladycanada</title>
<style>
  :root{
    --ink:#1A1618; --soft:#4A382E; --bg:#F7F4F2;
    --magenta:#FF2D95; --orange:#FF8A3A; --yellow:#FFD842;
    --band-ink:#110E10;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 20px 40px; text-align:center;
  }
  .card{width:100%; max-width:420px;}
  .handle{font-weight:700; font-size:15px; color:var(--soft); margin-bottom:6px;}
  h1{font-size:22px; margin:0 0 6px;}
  .product{font-size:14px; color:var(--soft); margin-bottom:28px; word-break:break-word;}
  .btn{
    display:block; width:100%; padding:18px 16px; border-radius:14px;
    font-size:17px; font-weight:700; text-decoration:none; border:none;
    cursor:pointer; margin-bottom:14px;
    background:linear-gradient(90deg,var(--magenta),var(--orange),var(--yellow));
    color:var(--band-ink);
  }
  .btn:active{opacity:.85;}
  .secondary{
    display:block; width:100%; padding:14px 16px; border-radius:14px;
    font-size:15px; font-weight:600; text-decoration:none;
    background:#fff; color:var(--ink); border:1.5px solid #e2ddd9;
  }
  .status{font-size:13px; color:var(--soft); min-height:18px; margin:14px 0 4px;}
  .autonote{font-size:12px; color:var(--soft); margin:-2px 0 14px;}
  .disclosure{font-size:12px; color:var(--soft); line-height:1.5; max-width:380px; margin-top:18px;}
</style>
</head>
<body>

  <div class="card">
    <div class="handle">@thefreebieladycanada</div>
    <h1>Opening your deal</h1>
    <div class="product" id="productLabel">Just a second…</div>

    <button class="btn" id="openAppBtn">Open in Amazon App</button>
    <a class="secondary" id="browserLink" href="#">Continue in browser</a>
    <div class="autonote">Trying automatically — tap the button above if nothing happens.</div>

    <div class="status" id="status"></div>

    <div class="disclosure">
      As an Amazon Associate I earn from qualifying purchases. Price and availability
      subject to change.
    </div>
  </div>

  <script>
  (function(){
    var TAG = "thefreebielad-20";
    var params = new URLSearchParams(window.location.search);
    var asin = (params.get("asin") || "").trim();

    if (!/^[A-Z0-9]{10}$/i.test(asin)) {
      document.getElementById("productLabel").textContent =
        "That link looks off — try it again from the Story.";
      document.getElementById("openAppBtn").style.display = "none";
      document.getElementById("browserLink").style.display = "none";
      document.querySelector(".autonote").style.display = "none";
      return;
    }

    var webUrl = "https://www.amazon.ca/dp/" + asin + "?tag=" + TAG;
    document.getElementById("productLabel").textContent = "Taking you to Amazon.ca";
    document.getElementById("browserLink").href = webUrl;

    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    var appUrl = null;
    if (isIOS) {
      // Unofficial, reverse-engineered iOS scheme for the Amazon Shopping app —
      // not documented by Amazon, may stop working without notice. Falls back
      // cleanly to webUrl below if it doesn't fire.
      appUrl = "com.amazon.mobile.shopping.web://amazon.ca/dp/" + asin + "/?tag=" + TAG;
    } else if (isAndroid) {
      // Standard Android intent: URI targeting the Amazon Shopping app's package,
      // with the plain https link as its own built-in fallback.
      appUrl = "intent://www.amazon.ca/dp/" + asin + "/?tag=" + TAG +
        "#Intent;package=com.amazon.mShop.android.shopping;scheme=https;end";
    }

    var statusEl = document.getElementById("status");
    var autoNoteEl = document.querySelector(".autonote");
    var fallbackTimer = null;

    function goToBrowser(){
      window.location.href = webUrl;
    }

    function clearFallback(){
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
    }

    function attemptOpen(isAuto){
      if (!appUrl) {
        goToBrowser();
        return;
      }
      clearFallback();     // cancel any earlier pending attempt, then start clean
      statusEl.textContent = "Trying the Amazon app…";
      // If the app actually opens, this tab backgrounds and the fallback below
      // never fires. If nothing happens (app not installed, or this particular
      // browser/webview blocks a scheme it didn't originate from a tap on), we
      // drop straight into the normal working amazon.ca link — so failure here
      // is invisible to whoever tapped it.
      window.location.href = appUrl;
      fallbackTimer = setTimeout(function(){
        fallbackTimer = null;
        goToBrowser();
      }, isAuto ? 900 : 1200);
    }

    document.getElementById("openAppBtn").addEventListener("click", function(e){
      e.preventDefault();
      attemptOpen(false);      // always live — never gated by whatever the auto-try did
    });

    document.addEventListener("visibilitychange", function(){
      if (document.hidden) clearFallback();
    });

    // If the browser restores this exact page from its own cache on a back
    // navigation, re-run cleanly instead of reusing whatever state the first
    // visit ended in.
    window.addEventListener("pageshow", function(e){
      if (e.persisted) {
        clearFallback();
        statusEl.textContent = "";
        if (appUrl) attemptOpen(true);
      }
    });

    // Try once automatically, the instant the page is ready, so a visitor often
    // only has to tap once (the Story sticker itself). This is genuinely a
    // second, automatic step though — every platform opens its own in-app
    // browser first no matter whose link is behind the sticker, and this can't
    // skip that. Some webviews block a scheme that wasn't triggered by a real
    // tap, in which case this quietly does nothing and the button above (or
    // "Continue in browser") still works normally.
    if (appUrl) {
      setTimeout(function(){ attemptOpen(true); }, 150);
    } else if (autoNoteEl) {
      autoNoteEl.style.display = "none";
    }
  })();
  </script>

</body>
</html>
